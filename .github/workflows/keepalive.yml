name: Keep app awake
on:
  schedule:
    - cron: "23 */5 * * *"   # every 5 hours at :23 UTC
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: keepalive
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/keepalive.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-v1
      - name: Install Playwright + Chromium
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium-headless-shell || python -m playwright install --with-deps chromium
      - name: Ping app
        run: python scripts/keepalive.py
